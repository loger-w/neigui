name: e2e
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest tests/ tests_e2e/ -v --tb=short
        env:
          FAKE_FINMIND: "1"
          FAKE_TODAY: "2026-06-26"
          FINMIND_TOKEN: fake

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('e2e/package-lock.json') }}
      - run: pip install -r backend/requirements.txt  # prod deps 足夠 — 不需 pytest
      - run: cd frontend && npm ci
      - run: cd e2e && npm ci
      # --with-deps 內部跑 apt-get update;2026-08-19 azure mirror 無回應卡滿 15 分鐘
      # 被 job timeout 砍 — 每次嘗試上限 150s、最多 3 次,讓 mirror flake 失敗得快且可重試
      - name: Install Playwright chromium + OS deps
        timeout-minutes: 8
        run: |
          cd e2e
          for i in 1 2 3; do
            timeout 150 npx playwright install --with-deps chromium && exit 0
            echo "attempt $i failed, retrying"; sleep 10
          done
          exit 1
      - run: cd e2e && npm test
        env:
          FAKE_FINMIND: "1"
          FAKE_TODAY: "2026-06-26"
          CHIP_DATA_DIR: "./.cache"
          FINMIND_TOKEN: fake
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
